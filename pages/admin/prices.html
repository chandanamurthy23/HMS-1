<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Price & Tariff Management - HMS Hospital Administration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>

  <div class="hms-wrapper">
    <!-- SIDEBAR -->
    <aside class="hms-sidebar" id="hms-sidebar"></aside>

    <!-- MAIN -->
    <div class="hms-main">
      <!-- HEADER -->
      <header class="hms-header" id="hms-header"></header>

      <!-- CONTENT BODY -->
      <main class="hms-content-body">
        
        <!-- PAGE HEADER -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
          <div>
            <h2 class="fw-bold text-dark mb-1">Hospital Master Tariffs & Price Catalog</h2>
            <p class="text-muted mb-0 small">Maintain standardized pricing and rates for clinical consultations, bed charges, diagnostic tests, and pharmaceuticals.</p>
          </div>
          <div class="d-flex gap-2" id="priceHeaderActions">
            <button class="btn btn-outline-secondary" onclick="loadPrices()">
              <i class="bi bi-arrow-clockwise me-1"></i> Refresh
            </button>
            <button class="btn btn-primary" id="addPriceItemBtn" onclick="openAddPriceModal()" style="display: none;">
              <i class="bi bi-plus-circle-fill me-1"></i> Add Billable Item
            </button>
          </div>
        </div>

        <!-- CATEGORY NAV TABS -->
        <ul class="nav nav-pills mb-4 gap-2 bg-white p-2 rounded-4 border shadow-sm" id="priceTabs">
          <li class="nav-item">
            <button class="nav-link active rounded-pill px-3 fw-semibold" onclick="filterType('all', this)">
              <i class="bi bi-grid-fill me-1"></i> All Items
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link rounded-pill px-3 fw-semibold" onclick="filterType('service', this)">
              <i class="bi bi-hospital me-1"></i> Clinical Services & Rooms
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link rounded-pill px-3 fw-semibold" onclick="filterType('test', this)">
              <i class="bi bi-eyedropper me-1"></i> Diagnostic & Lab Tests
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link rounded-pill px-3 fw-semibold" onclick="filterType('medicine', this)">
              <i class="bi bi-capsule me-1"></i> Medicines & Pharmacy
            </button>
          </li>
        </ul>

        <!-- SEARCH & STATUS TOOLBAR -->
        <div class="card border-0 shadow-sm rounded-4 mb-4 bg-white">
          <div class="card-body p-3">
            <div class="row g-2 align-items-center">
              <div class="col-12 col-md-6">
                <div class="input-group input-group-sm">
                  <span class="input-group-text bg-light"><i class="bi bi-search text-muted"></i></span>
                  <input type="text" class="form-control" id="priceSearchInput" placeholder="Search by name, code or category..." oninput="debouncePriceSearch()">
                </div>
              </div>
              <div class="col-6 col-md-3">
                <select class="form-select form-select-sm" id="priceStatusFilter" onchange="loadPrices()">
                  <option value="all">All Statuses</option>
                  <option value="active">Active Tariffs</option>
                  <option value="inactive">Inactive / Archived</option>
                </select>
              </div>
              <div class="col-6 col-md-3 text-end">
                <button class="btn btn-sm btn-outline-secondary w-100" onclick="resetPriceFilters()">
                  <i class="bi bi-arrow-counterclockwise me-1"></i> Reset
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- PRICING TABLE -->
        <div class="card border-0 shadow-sm rounded-4 bg-white overflow-hidden">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 text-nowrap">
              <thead class="table-light">
                <tr>
                  <th class="ps-4">Item Code</th>
                  <th>Item Name & Description</th>
                  <th>Type</th>
                  <th>Category</th>
                  <th>Department</th>
                  <th class="text-end">Unit Price (₹)</th>
                  <th>Status</th>
                  <th class="text-end pe-4" id="thActions">Actions</th>
                </tr>
              </thead>
              <tbody id="pricesTableBody">
                <tr>
                  <td colspan="8" class="text-center py-5 text-muted">
                    <span class="spinner-border spinner-border-sm me-2"></span>Loading price catalog...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- MODAL: ADD / EDIT PRICE ITEM -->
  <div class="modal fade" id="priceItemModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <form onsubmit="savePriceItem(event)">
          <input type="hidden" id="modalItemId" value="0">
          <div class="modal-header border-bottom">
            <h5 class="modal-title fw-bold" id="priceModalTitle"><i class="bi bi-tag text-primary me-2"></i> Add Billable Item</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4">
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label small fw-semibold text-secondary">Item Type <span class="text-danger">*</span></label>
                <select class="form-select" id="modalItemType" required>
                  <option value="service">Clinical Service</option>
                  <option value="test">Diagnostic / Lab Test</option>
                  <option value="medicine">Medicine / Drug</option>
                  <option value="other">Other Billable</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label small fw-semibold text-secondary">Unique Code <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="modalItemCode" placeholder="e.g. LAB-CBC" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">Item Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="modalItemName" placeholder="e.g. Complete Blood Count (CBC)" required>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label small fw-semibold text-secondary">Category</label>
                <input type="text" class="form-control" id="modalItemCategory" placeholder="e.g. Pathology">
              </div>
              <div class="col-6">
                <label class="form-label small fw-semibold text-secondary">Unit Price (₹) <span class="text-danger">*</span></label>
                <input type="number" step="0.01" min="0" class="form-control" id="modalItemPrice" placeholder="350.00" required>
              </div>
            </div>
            <div class="row g-2">
              <div class="col-6">
                <label class="form-label small fw-semibold text-secondary">Department</label>
                <select class="form-select" id="modalItemDept">
                  <option value="8">General Medicine</option>
                  <option value="1">Cardiology</option>
                  <option value="2">Neurology</option>
                  <option value="3">Orthopedics</option>
                  <option value="4">Pediatrics</option>
                  <option value="5">Gynecology</option>
                  <option value="6">Dermatology</option>
                  <option value="7">Gastroenterology</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label small fw-semibold text-secondary">Status</label>
                <select class="form-select" id="modalItemStatus">
                  <option value="1">Active</option>
                  <option value="0">Inactive</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer border-top bg-light">
            <button type="button" class="btn btn-outline-secondary btn-sm px-3" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary btn-sm px-4" id="savePriceBtn">Save Item</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/navigation.js"></script>

  <script>
    const FALLBACK_PRICES = [
      { id: 1, item_type: 'service', category: 'Consultations', code: 'CONS-GEN',  name: 'General Physician OPD Consultation', unit_price: 500.00, department_name: 'General Medicine', status: 'active' },
      { id: 2, item_type: 'service', category: 'Consultations', code: 'CONS-SPEC', name: 'Super Specialist Consultation (Cardio/Neuro)', unit_price: 1000.00, department_name: 'Cardiology', status: 'active' },
      { id: 3, item_type: 'service', category: 'Room & Bed',    code: 'BED-GEN',   name: 'General Ward Bed (Per Day)',          unit_price: 1200.00, department_name: 'General Medicine', status: 'active' },
      { id: 4, item_type: 'service', category: 'Room & Bed',    code: 'BED-ICU',   name: 'Intensive Care Unit (ICU Per Day)',   unit_price: 6500.00, department_name: 'Cardiology', status: 'active' },
      { id: 5, item_type: 'service', category: 'Procedures',    code: 'PROC-DRES', name: 'Surgical Dressing & Wound Care',      unit_price: 350.00,  department_name: 'Orthopedics', status: 'active' },
      { id: 6, item_type: 'service', category: 'Procedures',    code: 'PROC-NEB',  name: 'Nebulization Session',                 unit_price: 200.00,  department_name: 'General Medicine', status: 'active' },
      { id: 7, item_type: 'test',    category: 'Pathology',     code: 'LAB-CBC',   name: 'Complete Blood Count (CBC)',           unit_price: 350.00,  department_name: 'Cardiology', status: 'active' },
      { id: 8, item_type: 'test',    category: 'Pathology',     code: 'LAB-LFT',   name: 'Liver Function Test (LFT)',            unit_price: 850.00,  department_name: 'Gastroenterology', status: 'active' },
      { id: 9, item_type: 'test',    category: 'Pathology',     code: 'LAB-KFT',   name: 'Kidney Function Test (KFT / RFT)',     unit_price: 750.00,  department_name: 'General Medicine', status: 'active' },
      { id: 10, item_type: 'test',   category: 'Pathology',     code: 'LAB-LIPID', name: 'Lipid Profile Comprehensive',          unit_price: 600.00,  department_name: 'Cardiology', status: 'active' },
      { id: 11, item_type: 'test',   category: 'Pathology',     code: 'LAB-THY',   name: 'Thyroid Profile (T3, T4, TSH)',        unit_price: 550.00,  department_name: 'General Medicine', status: 'active' },
      { id: 12, item_type: 'test',   category: 'Pathology',     code: 'LAB-BS',    name: 'Fasting & PP Blood Sugar',             unit_price: 150.00,  department_name: 'General Medicine', status: 'active' },
      { id: 13, item_type: 'test',   category: 'Radiology',     code: 'RAD-XRAY',  name: 'Digital Chest X-Ray (PA View)',        unit_price: 500.00,  department_name: 'Cardiology', status: 'active' },
      { id: 14, item_type: 'test',   category: 'Radiology',     code: 'RAD-ECG',   name: '12-Lead Electrocardiogram',            unit_price: 350.00,  department_name: 'Cardiology', status: 'active' },
      { id: 15, item_type: 'test',   category: 'Radiology',     code: 'RAD-USG',   name: 'Whole Abdomen Ultrasound',             unit_price: 1200.00, department_name: 'Gastroenterology', status: 'active' },
      { id: 16, item_type: 'test',   category: 'Radiology',     code: 'RAD-ECHO',  name: '2D Echocardiography with Doppler',     unit_price: 2200.00, department_name: 'Cardiology', status: 'active' },
      { id: 17, item_type: 'medicine', category: 'Antibiotics', code: 'MED-AMOX',  name: 'Amoxicillin 500mg (Strip of 10)',     unit_price: 110.00,  department_name: 'General Medicine', status: 'active' },
      { id: 18, item_type: 'medicine', category: 'Cardiovascular', code: 'MED-ATRV', name: 'Atorvastatin 20mg (Strip of 10)',  unit_price: 165.00,  department_name: 'Cardiology', status: 'active' },
      { id: 19, item_type: 'medicine', category: 'Antidiabetic', code: 'MED-METF', name: 'Metformin 500mg SR (Strip of 15)',    unit_price: 68.00,   department_name: 'General Medicine', status: 'active' },
      { id: 20, item_type: 'medicine', category: 'Vitamins',      code: 'MED-VITD', name: 'Vitamin D3 60,000 IU (Strip of 4)',    unit_price: 120.00,  department_name: 'General Medicine', status: 'active' }
    ];

    let allPrices = [];
    let currentTypeFilter = 'all';
    let canUserManagePrices = false;
    let priceModalInstance = null;
    let priceSearchTimer = null;

    document.addEventListener('DOMContentLoaded', () => {
      HMSNav.init('prices', 'Price Management', ['Home', 'Administration', 'Prices'], 'price.view');
      priceModalInstance = new bootstrap.Modal(document.getElementById('priceItemModal'));
      loadPrices();
    });

    function filterType(type, btn) {
      currentTypeFilter = type;
      document.querySelectorAll('#priceTabs .nav-link').forEach(l => l.classList.remove('active'));
      if (btn) btn.classList.add('active');
      loadPrices();
    }

    function renderFallbackPrices(typeFilter, search, status) {
      let items = [...FALLBACK_PRICES];
      if (typeFilter && typeFilter !== 'all') {
        items = items.filter(i => i.item_type === typeFilter);
      }
      if (status && status !== 'all') {
        items = items.filter(i => i.status === status);
      }
      if (search) {
        const q = search.toLowerCase();
        items = items.filter(i => i.name.toLowerCase().includes(q) || i.code.toLowerCase().includes(q) || i.category.toLowerCase().includes(q));
      }
      allPrices = items;
      canUserManagePrices = true;
      const addBtn = document.getElementById('addPriceItemBtn');
      if (addBtn) addBtn.style.display = 'inline-flex';
      renderPricesTable(allPrices);
    }

    async function loadPrices() {
      const search = document.getElementById('priceSearchInput').value;
      const status = document.getElementById('priceStatusFilter').value;

      // 1. Immediately render fallback items so user sees table instantly
      renderFallbackPrices(currentTypeFilter, search, status);

      // 2. Query cloud API asynchronously
      let url = `../../api/prices.php?action=list&type=${currentTypeFilter}&status=${status}`;
      if (search) {
        url += `&search=${encodeURIComponent(search)}`;
      }

      try {
        const resp = await fetch(url);
        if (resp.ok) {
          const data = await resp.json().catch(() => null);
          if (data && data.success && Array.isArray(data.items) && data.items.length > 0) {
            allPrices = data.items;
            canUserManagePrices = Boolean(data.can_manage);
            const addBtn = document.getElementById('addPriceItemBtn');
            if (addBtn) {
              addBtn.style.display = canUserManagePrices ? 'inline-flex' : 'none';
            }
            renderPricesTable(allPrices);
          }
        }
      } catch (err) {
        console.warn('API load prices finished with local fallback active:', err);
      }
    }

    function renderPricesTable(items) {
      const tbody = document.getElementById('pricesTableBody');
      if (!tbody) return;

      if (items.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" class="text-center py-5 text-muted">
              <i class="bi bi-tag fs-2 d-block mb-2 text-secondary"></i>
              No billable items found matching filter criteria.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = items.map(item => {
        const isActive = (item.status === 'active');
        const statusBadge = isActive 
          ? `<span class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1">Active</span>` 
          : `<span class="badge bg-secondary-subtle text-secondary border border-secondary-subtle px-2 py-1">Inactive</span>`;

        const typeBadge = getTypeBadge(item.item_type);

        const actionsHtml = canUserManagePrices ? `
          <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-secondary" title="Edit Item" onclick="openEditPriceModal(${item.id})">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn ${isActive ? 'btn-outline-danger' : 'btn-outline-success'}" title="${isActive ? 'Deactivate' : 'Activate'}" onclick="togglePriceStatus(${item.id})">
              <i class="bi ${isActive ? 'bi-slash-circle' : 'bi-check-circle'}"></i>
            </button>
          </div>
        ` : `<span class="text-muted small">View Only</span>`;

        return `
          <tr>
            <td class="ps-4"><strong class="font-monospace text-primary">${escapeHtml(item.code)}</strong></td>
            <td>
              <div class="fw-bold text-dark">${escapeHtml(item.name)}</div>
            </td>
            <td>${typeBadge}</td>
            <td><span class="text-muted small">${escapeHtml(item.category)}</span></td>
            <td><span class="text-muted small">${escapeHtml(item.department_name)}</span></td>
            <td class="text-end fw-bold text-dark">₹${Number(item.unit_price).toFixed(2)}</td>
            <td>${statusBadge}</td>
            <td class="text-end pe-4">${actionsHtml}</td>
          </tr>
        `;
      }).join('');
    }

    function getTypeBadge(type) {
      const t = (type || '').toLowerCase();
      if (t === 'service') return '<span class="badge bg-primary-subtle text-primary border border-primary-subtle">Service</span>';
      if (t === 'test') return '<span class="badge bg-purple text-white">Diagnostic</span>';
      if (t === 'medicine') return '<span class="badge bg-success-subtle text-success border border-success-subtle">Pharmacy</span>';
      return '<span class="badge bg-light text-secondary border">Item</span>';
    }

    function debouncePriceSearch() {
      clearTimeout(priceSearchTimer);
      priceSearchTimer = setTimeout(() => loadPrices(), 300);
    }

    function resetPriceFilters() {
      document.getElementById('priceSearchInput').value = '';
      document.getElementById('priceStatusFilter').value = 'all';
      loadPrices();
    }

    function openAddPriceModal() {
      document.getElementById('priceModalTitle').innerHTML = '<i class="bi bi-tag-fill text-primary me-2"></i> Add Billable Item';
      document.getElementById('modalItemId').value = '0';
      document.getElementById('modalItemCode').value = '';
      document.getElementById('modalItemName').value = '';
      document.getElementById('modalItemCategory').value = '';
      document.getElementById('modalItemPrice').value = '';
      priceModalInstance.show();
    }

    function openEditPriceModal(id) {
      const item = allPrices.find(p => p.id === id);
      if (!item) return;

      document.getElementById('priceModalTitle').innerHTML = '<i class="bi bi-pencil-square text-primary me-2"></i> Edit Billable Item';
      document.getElementById('modalItemId').value = item.id;
      document.getElementById('modalItemType').value = item.item_type;
      document.getElementById('modalItemCode').value = item.code;
      document.getElementById('modalItemName').value = item.name;
      document.getElementById('modalItemCategory').value = item.category;
      document.getElementById('modalItemPrice').value = item.unit_price;
      if (item.department_id) {
        document.getElementById('modalItemDept').value = item.department_id;
      }
      document.getElementById('modalItemStatus').value = (item.status === 'active') ? '1' : '0';
      priceModalInstance.show();
    }

    async function savePriceItem(e) {
      e.preventDefault();
      const id = parseInt(document.getElementById('modalItemId').value);
      const payload = {
        action: 'save',
        id: id,
        item_type: document.getElementById('modalItemType').value,
        code: document.getElementById('modalItemCode').value.trim(),
        name: document.getElementById('modalItemName').value.trim(),
        category: document.getElementById('modalItemCategory').value.trim(),
        unit_price: parseFloat(document.getElementById('modalItemPrice').value),
        department_id: document.getElementById('modalItemDept').value,
        status: parseInt(document.getElementById('modalItemStatus').value)
      };

      const btn = document.getElementById('savePriceBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Saving...';

      try {
        const resp = await fetch('../../api/prices.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await resp.json();

        if (data.success) {
          priceModalInstance.hide();
          loadPrices();
        } else {
          alert(data.message || 'Error saving price item.');
        }
      } catch (err) {
        console.error(err);
        alert('Server communication error.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Save Item';
      }
    }

    async function togglePriceStatus(id) {
      try {
        const resp = await fetch('../../api/prices.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'toggle_status', id: id })
        });
        const data = await resp.json();
        if (data.success) {
          loadPrices();
        } else {
          alert(data.message || 'Failed to toggle status.');
        }
      } catch (err) {
        console.error(err);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
